<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkroom</title>
<meta name="description" content="Describe a picture and watch it develop.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131211">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131211'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f2a33a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #131211;        /* page */
  --tray: #1b1917;       /* surfaces */
  --edge: #2e2a26;       /* hairlines */
  --paper: #ece6db;      /* text */
  --stone: #9a9186;      /* secondary text */
  --safelight: #f2a33a;  /* the one accent */
  --danger: #ff8f7a;
  --font: "Bricolage Grotesque", system-ui, sans-serif;
  color-scheme: dark;
  accent-color: var(--safelight);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ink); }
body {
  margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr;
  background: var(--ink); color: var(--paper);
  font: 400 1rem/1.5 var(--font); font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, summary { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--safelight); outline-offset: 2px; }
::selection { background: var(--safelight); color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* header */
header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; }
.mark { font-size: 1.375rem; font-weight: 700; font-stretch: 75%; letter-spacing: -0.01em; }
.mark i { display: inline-block; width: .5em; height: .5em; margin-right: .45em; border-radius: 50%; background: var(--safelight); vertical-align: .05em; }
.conn { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--stone); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--stone); }
.conn[data-on="true"]::before { background: var(--paper); border-color: var(--paper); }

/* layout */
main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; padding: 0 32px 32px; align-items: start; }
.stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stage-area { display: grid; place-items: center; min-height: 340px; }

/* the frame: empty, busy, ready, error */
.frame {
  --ar: 1;
  position: relative; aspect-ratio: var(--ar); overflow: hidden;
  width: min(100%, calc((100dvh - 330px) * var(--ar)));
  min-width: min(100%, 280px);
  background: var(--tray); border: 1px solid var(--edge); border-radius: 4px;
  display: grid; place-items: center; transition: aspect-ratio .3s ease; isolation: isolate;
}
.frame > * { grid-area: 1 / 1; }
.frame .layer { display: none; padding: 8% ; text-align: left; width: 100%; }
.frame[data-state="empty"] .empty,
.frame[data-state="busy"] .busy,
.frame[data-state="error"] .error { display: block; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: none; }
.frame[data-state="ready"] img { display: block; }

.empty h1 { margin: 0; font-weight: 300; font-size: clamp(2.25rem, 5.5vw, 4.5rem); line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance; }
.empty p { margin: 16px 0 0; color: var(--stone); font-size: 1.0625rem; }

.frame .busy { text-align: center; }
.busy::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 50% 100%, rgb(242 163 58 / .28), transparent 65%), radial-gradient(ellipse at 50% 0%, rgb(242 163 58 / .12), transparent 60%);
  animation: safelight 2.6s ease-in-out infinite; }
.busy strong { display: block; font-size: 1.5rem; font-weight: 300; letter-spacing: -0.01em; }
.busy span { color: var(--stone); font-variant-numeric: tabular-nums; }
@keyframes safelight { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }

.error { color: var(--danger); max-width: 34ch; margin-inline: auto; }
.error strong { display: block; color: var(--paper); font-size: 1.25rem; font-weight: 600; margin-bottom: 6px; }

/* the one moment: the picture develops */
.frame img.develop { animation: develop 2.4s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes develop {
  from { filter: brightness(0) blur(30px) saturate(.3); }
  55%  { filter: brightness(.5) blur(10px) saturate(.7); }
  to   { filter: none; }
}

.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; min-height: 44px; font-size: .875rem; color: var(--stone); }
.bar[hidden] { display: none; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.meta b { color: var(--paper); font-weight: 500; }
.note { flex-basis: 100%; margin: 0; }
.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; background: transparent; border: 1px solid var(--edge); border-radius: 6px; cursor: pointer; text-decoration: none; color: var(--paper); }
.btn:hover { border-color: var(--stone); }
.btn[hidden] { display: none; }

/* filmstrip */
.roll { display: none; }
.roll.has { display: block; }
.roll-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: .875rem; color: var(--stone); }
.roll-head button { background: none; border: 0; color: var(--stone); cursor: pointer; min-height: 44px; padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; }
.strip { display: flex; gap: 10px; overflow-x: auto; padding: 14px 0; position: relative; scrollbar-color: var(--edge) transparent; scrollbar-width: thin;
  background:
    repeating-linear-gradient(90deg, var(--edge) 0 7px, transparent 7px 14px) top / 100% 3px no-repeat,
    repeating-linear-gradient(90deg, var(--edge) 0 7px, transparent 7px 14px) bottom / 100% 3px no-repeat; }
.strip button { flex: none; padding: 0; border: 1px solid var(--edge); border-radius: 3px; background: var(--tray); cursor: pointer; overflow: hidden; height: 88px; }
.strip button[aria-current="true"] { border-color: var(--safelight); }
.strip img { height: 100%; width: auto; display: block; }

/* composer */
.panel { display: flex; flex-direction: column; gap: 24px; }
.field { display: flex; flex-direction: column; gap: 8px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > label, .field > legend { padding: 0; font-size: .9375rem; font-weight: 600; }
.hint { font-size: .8125rem; color: var(--stone); font-weight: 400; }
textarea, input[type="number"], input[type="text"] {
  width: 100%; background: var(--tray); border: 1px solid var(--edge); border-radius: 6px; padding: 12px 14px; line-height: 1.45;
}
textarea { field-sizing: content; min-block-size: 8rem; max-block-size: 16rem; resize: none; }
textarea::placeholder, input::placeholder { color: #6f675d; }
textarea:focus-visible, input:focus-visible { outline-offset: 0; border-color: var(--safelight); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 36px; padding: 0 12px; background: none; border: 1px solid var(--edge); border-radius: 4px; color: var(--stone); cursor: pointer; font-size: .875rem; }
.chips button:hover { color: var(--paper); border-color: var(--stone); }

.seg { display: flex; border: 1px solid var(--edge); border-radius: 6px; overflow: hidden; background: var(--tray); }
.seg label { flex: 1; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 56px; padding: 8px 4px; cursor: pointer; font-size: .875rem; color: var(--stone); }
.seg label + label { border-left: 1px solid var(--edge); }
.seg label:has(input:checked) { background: var(--paper); color: var(--ink); font-weight: 600; }
.seg label:has(input:focus-visible) { outline: 2px solid var(--safelight); outline-offset: -2px; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg.one label { min-height: 44px; flex-direction: row; }
.ico { display: block; height: 16px; border: 1.5px solid currentColor; border-radius: 2px; }

.range { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; }
.range input { grid-column: 1 / -1; width: 100%; margin: 0; min-height: 28px; }
.range output { font-variant-numeric: tabular-nums; color: var(--stone); font-size: .875rem; }

details { border-top: 1px solid var(--edge); padding-top: 8px; }
summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; font-size: .9375rem; }
details[open] summary { margin-bottom: 8px; }
details .field + .field { margin-top: 16px; }
.seedrow { display: flex; gap: 12px; align-items: center; }
.seedrow input[type="number"] { flex: 1; }
.seedrow label { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: .9375rem; white-space: nowrap; min-height: 44px; }
.seedrow input[type="checkbox"] { width: 18px; height: 18px; margin: 0; }
input:disabled { opacity: .45; }

.go { display: flex; flex-direction: column; gap: 8px; }
#go { min-height: 54px; border: 0; border-radius: 6px; background: var(--safelight); color: var(--ink); font-weight: 700; font-size: 1.0625rem; cursor: pointer; }
