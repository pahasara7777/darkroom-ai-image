<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darkroom</title>
<meta name="description" content="Describe a picture and watch it develop.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#131211">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23131211'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f2a33a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #131211;        /* page */
  --tray: #1b1917;       /* surfaces */
  --edge: #2e2a26;       /* hairlines */
  --paper: #ece6db;      /* text */
  --stone: #9a9186;      /* secondary text */
  --safelight: #f2a33a;  /* the one accent */
  --danger: #ff8f7a;
  --font: "Bricolage Grotesque", system-ui, sans-serif;
  color-scheme: dark;
  accent-color: var(--safelight);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ink); }
body {
  margin: 0; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr;
  background: var(--ink); color: var(--paper);
  font: 400 1rem/1.5 var(--font); font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, summary { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--safelight); outline-offset: 2px; }
::selection { background: var(--safelight); color: var(--ink); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* header */
header { display: flex; align-items: center; justify-content: space-between; padding: 20px 32px; }
.mark { font-size: 1.375rem; font-weight: 700; font-stretch: 75%; letter-spacing: -0.01em; }
.mark i { display: inline-block; width: .5em; height: .5em; margin-right: .45em; border-radius: 50%; background: var(--safelight); vertical-align: .05em; }
.conn { display: flex; align-items: center; gap: 8px; font-size: .875rem; color: var(--stone); }
.conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--stone); }
.conn[data-on="true"]::before { background: var(--paper); border-color: var(--paper); }

/* layout */
main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 48px; padding: 0 32px 32px; align-items: start; }
.stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stage-area { display: grid; place-items: center; min-height: 340px; }

/* the frame: empty, busy, ready, error */
.frame {
  --ar: 1;
  position: relative; aspect-ratio: var(--ar); overflow: hidden;
  width: min(100%, calc((100dvh - 330px) * var(--ar)));
  min-width: min(100%, 280px);
  background: var(--tray); border: 1px solid var(--edge); border-radius: 4px;
  display: grid; place-items: center; transition: aspect-ratio .3s ease; isolation: isolate;
}
.frame > * { grid-area: 1 / 1; }
.frame .layer { display: none; padding: 8% ; text-align: left; width: 100%; }
.frame[data-state="empty"] .empty,
.frame[data-state="busy"] .busy,
.frame[data-state="error"] .error { display: block; }
.frame img { width: 100%; height: 100%; object-fit: cover; display: none; }
.frame[data-state="ready"] img { display: block; }

.empty h1 { margin: 0; font-weight: 300; font-size: clamp(2.25rem, 5.5vw, 4.5rem); line-height: 1.02; letter-spacing: -0.025em; text-wrap: balance; }
.empty p { margin: 16px 0 0; color: var(--stone); font-size: 1.0625rem; }

.frame .busy { text-align: center; }
.busy::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: radial-gradient(ellipse at 50% 100%, rgb(242 163 58 / .28), transparent 65%), radial-gradient(ellipse at 50% 0%, rgb(242 163 58 / .12), transparent 60%);
  animation: safelight 2.6s ease-in-out infinite; }
.busy strong { display: block; font-size: 1.5rem; font-weight: 300; letter-spacing: -0.01em; }
